# Weekly dependency updates, grouped so each ecosystem opens at most one PR a week
# (minor and patch together; majors separately so they can be reviewed on their own).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Australia/Melbourne }
    groups:
      api-minor:
        update-types: [minor, patch]
    ignore:
      # firebase-admin 14 brings jwks-rsa 4, which require()s the ES module jose. Vercel's
      # function runtime rejects that (ERR_REQUIRE_ESM) and every API function fails to start.
      - dependency-name: firebase-admin
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /web-app
    schedule: { interval: weekly, day: monday, timezone: Australia/Melbourne }
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web-app/functions
    schedule: { interval: weekly, day: monday, timezone: Australia/Melbourne }
    groups:
      functions-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests/rules
    schedule: { interval: monthly }
    groups:
      rules-tests:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly, day: monday, timezone: Australia/Melbourne }
    groups:
      flutter-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
