name: Test Suite

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'web-app/**'
      - 'api/**'
      - 'tests/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'package*.json'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
  # Lets the deploy workflow run the full suite before deploying.
  workflow_call:

jobs:
  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Includes the axe-core accessibility checks in src/__tests__/accessibility
      - run: npm test -- --maxWorkers=2
        env:
          CI: true
          NODE_ENV: test

      - run: npm run build

  api-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - run: npm ci

      - name: Syntax-check API, Cloud Functions and scripts
        run: |
          for f in api/*.js api/*/*.js web-app/functions/index.js web-app/functions/lib/*.js scripts/*.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: API unit tests
        run: npm test

      - name: Cloud Functions unit tests
        working-directory: web-app/functions
        run: |
          npm ci
          npm test

  mobile-app:
    # Urban Pay Flutter app: static analysis and unit/widget tests (no device needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  security-rules:
    # Every allow/deny in firestore.rules and storage.rules, against the Firebase emulators.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm test
